spring.application.name=kosmo_pro-book
# 앱 이름

server.port=9090
# 9090 포트 사용 (80, 8085 이미 다른 프로젝트가 쓰는 중)
# 실행 후 localhost:9090 으로 접속

spring.mvc.view.prefix=/WEB-INF/views/
# Controller에서 "bookList" 리턴하면 앞에 이걸 붙임

spring.mvc.view.suffix=.jsp
# 뒤에 .jsp 붙임. 결국 /WEB-INF/views/bookList.jsp 파일을 찾아감

spring.datasource.url=jdbc:h2:mem:bookdb
# H2 인메모리 DB. mem = 메모리에만 존재, bookdb = DB 이름

spring.datasource.driver-class-name=org.h2.Driver
# H2 DB 접속용 드라이버 (DB 종류마다 다름)

spring.datasource.username=sa
# H2 기본 계정명

spring.datasource.password=
# H2 기본 비밀번호 없음 (공백)

mybatis.configuration.map-underscore-to-camel-case=true
# DB 컬럼명(book_id) → Java 필드명(bookId) 자동 변환

mybatis.type-aliases-package=com.joe.book.model
# XML에서 Step2_BookDTO를 풀경로 없이 짧게 쓸 수 있게 해줌

mybatis.mapper-locations=classpath:mapper/**/*.xml
# SQL XML 파일 위치. src/main/resources/mapper/ 폴더 안의 모든 XML 읽음

spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
# 앱 시작할 때 schema.sql → data.sql 순서로 자동 실행
# schema.sql: book 테이블 생성
# data.sql: 샘플 데이터 3건 삽입


