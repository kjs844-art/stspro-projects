# ============================================================
# Spring Boot app name - shows in console logs
# ============================================================
spring.application.name=kosmo_solo_java

# ============================================================
# Server port - access at http://localhost:8086
# ============================================================
server.port=8086

# ============================================================
# H2 Database (in-memory mode)
# "mem:testdb" means the database lives only while the app runs
# No installation needed - H2 runs embedded inside Java
# ============================================================
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console - visit http://localhost:8086/h2-console in browser
# to see tables and run SQL queries manually
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============================================================
# MyBatis Configuration
# mapper-locations: where MyBatis XML files live
# type-aliases-package: lets MyBatis find DTO classes by short name
# map-underscore-to-camel-case: notice_id in DB -> noticeId in Java
# ============================================================
mybatis.mapper-locations=classpath:mappers/*.xml
mybatis.type-aliases-package=com.joe.java
mybatis.configuration.map-underscore-to-camel-case=true

# ============================================================
# JSP View Resolver
# Controller returns "notice/list" -> /WEB-INF/views/notice/list.jsp
# ============================================================
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# ============================================================
# Auto-create tables from schema.sql on every startup
# ============================================================
spring.sql.init.mode=always
